[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agents-corpus"
version = "0.1.0"
description = "Capture operational lessons, retrieve them before mistakes repeat, and train a local relevance ranker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shawn Reddy"}]
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "pydantic>=2.6,<3", "json-repair>=0.30,<1", "uvicorn>=0.30,<1", "mcp>=1.26,<2"]

[project.optional-dependencies]
rerank = ["torch>=2.4,<3", "transformers>=4.44,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "respx>=0.22,<1", "build>=1,<2"]

[project.scripts]
corpus-ingest = "learning_corpus_pipeline.corpus_ingest:main"
smart-agents = "smart_agents.cli:main"
smart-agents-mcp = "smart_agents.mcp:main"

[tool.setuptools.packages.find]
include = ["smart_agents*", "corpus_api*", "learning_classifier*", "learning_corpus_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.setuptools.package-data]
"smart_agents.rerank" = ["*.json"]
"smart_agents" = ["sql/*.sql"]
